[package]
name = "gpui-icons"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
description = "The complete, embedded Lucide icon set for GPUI."
repository = "https://github.com/karyalabs/gpui-icons"
readme = "README.md"
license = "MIT AND ISC"
keywords = ["gpui", "icons", "lucide"]
categories = ["gui"]
include = [
  "src/**",
  "scripts/**",
  "assets/**",
  "LICENSES/**",
  "LICENSE",
  "README.md",
  "RELEASE-MANIFEST.json",
  "Cargo.toml",
]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-fast = { package = "gpui-fast", version = "0.1.13", optional = true, features = ["windows-manifest-provided-by-host"] }

[features]
# Builds against Longbridge's GPUI Fast instead of gpui-pre, to pair with
# GPUI Kit's `gpui-fast` feature.
gpui-fast = ["dep:gpui-fast"]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[lints.rust]
missing_docs = "deny"
